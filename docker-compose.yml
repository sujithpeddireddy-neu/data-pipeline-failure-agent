name: pipefail

x-airflow-common: &airflow-common
  image: pipefail-airflow:2.8.4
  pull_policy: never

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?FERNET_KEY is required in .env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow/src
    PIPEFAIL_DATA_DIR: /opt/airflow/datasets

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src:ro
    - ../datasets:/opt/airflow/datasets

  user: "${AIRFLOW_UID:-50000}:0"

services:

  postgres:
    image: postgres:13
    pull_policy: never

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      retries: 5

    restart: unless-stopped

  airflow-init:
    <<: *airflow-common

    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}

    entrypoint: /bin/bash

    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Capstone \
          --lastname Admin \
          --role Admin \
          --email admin@example.invalid

    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common

    command: webserver

    ports:
      - "127.0.0.1:8081:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres-db-volume: