[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipefail"
version = "0.1.0"
description = "AI-powered data pipeline failure detection, diagnosis, and repair"
requires-python = ">=3.11"
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "great_expectations",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

ml = [
    "lightgbm==4.7.0",
    "scikit-learn",
    "numpy",
    "scipy",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]